user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Video responses are already compressed; compressing them again wastes CPU
    # and breaks nothing but is pointless, so mp4/webm are deliberately absent.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/vtt application/json
                      application/javascript application/xml+rss
                      image/svg+xml application/vnd.apple.mpegurl;

    # Media streaming means large, long-lived responses.
    client_max_body_size  32m;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_buffering       off;

    # Basic abuse protection at the edge, on top of the API's own throttling.
    limit_req_zone  $binary_remote_addr zone=api:10m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m  rate=1r/s;

    include /etc/nginx/conf.d/*.conf;
}
