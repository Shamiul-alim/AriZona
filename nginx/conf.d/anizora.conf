# =============================================================================
# AniZora reverse proxy
# =============================================================================
# Enable with:  docker compose --profile proxy up -d
#
# Puts the frontend and the API behind a single origin, which removes the need
# for CORS in production and lets the media proxy stream from the same host the
# page was served from.
#
# For TLS, put your certificates in nginx/certs and uncomment the 443 block.
# =============================================================================

upstream anizora_frontend {
    server frontend:3000;
    keepalive 32;
}

upstream anizora_backend {
    server backend:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # --- API -----------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=60 nodelay;

        proxy_pass         http://anizora_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Auth endpoints get a tighter rate limit than the rest of the API.
    location ~ ^/api/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass         http://anizora_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Media streaming -----------------------------------------------------
    # Buffering must stay off here: the proxy relays Range responses from the
    # upstream provider, and buffering would break seeking and waste memory on
    # multi-hundred-megabyte files.
    location /api/media/ {
        proxy_pass              http://anizora_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Range             $http_range;
        proxy_set_header        If-Range          $http_if_range;
        proxy_set_header        Connection        "";

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_read_timeout      900s;

        add_header Accept-Ranges bytes always;
    }

    # --- Uploaded assets -----------------------------------------------------
    location /uploads/ {
        proxy_pass       http://anizora_backend;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # --- Next.js static output ----------------------------------------------
    # Hashed filenames, so these can be cached indefinitely.
    location /_next/static/ {
        proxy_pass       http://anizora_frontend;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Everything else -> Next.js -----------------------------------------
    location / {
        proxy_pass         http://anizora_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    add_header X-Content-Type-Options    nosniff       always;
    add_header X-Frame-Options           SAMEORIGIN    always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
}

# -----------------------------------------------------------------------------
# TLS. Put fullchain.pem / privkey.pem in nginx/certs, mount that directory in
# docker-compose, then uncomment this block and the redirect above it.
