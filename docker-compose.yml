name: anizora

services:
  postgres:
    image: postgres:16-alpine
    container_name: anizora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anizora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anizora}
      POSTGRES_DB: ${POSTGRES_DB:-anizora}
      # Deterministic collation so ORDER BY on titles is stable across hosts
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anizora} -d ${POSTGRES_DB:-anizora}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [anizora]

  redis:
    image: redis:7-alpine
    container_name: anizora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [anizora]

  mailhog:
    image: axllent/mailpit:latest
    container_name: anizora-mailhog
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks: [anizora]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-production}
    container_name: anizora-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      RUN_SEED: ${RUN_SEED:-false}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-anizora}:${POSTGRES_PASSWORD:-anizora}@postgres:5432/${POSTGRES_DB:-anizora}?schema=public
      # Prisma runs migrations over a direct session connection. Locally that is
      # the same database; on Supabase it is port 5432 rather than the 6543 pooler.
      DIRECT_URL: postgresql://${POSTGRES_USER:-anizora}:${POSTGRES_PASSWORD:-anizora}@postgres:5432/${POSTGRES_DB:-anizora}?schema=public
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_URL: redis://redis:6379
      API_PREFIX: ${API_PREFIX:-api}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SITE_NAME: ${SITE_NAME:-AniZora}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      JWT_REFRESH_TTL_REMEMBER: ${JWT_REFRESH_TTL_REMEMBER:-90d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@anizora.local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      GOOGLE_OAUTH_ENABLED: ${GOOGLE_OAUTH_ENABLED:-false}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_CALLBACK_URL: ${GOOGLE_OAUTH_CALLBACK_URL:-}
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_DRIVE_AUTH_MODE: ${GOOGLE_DRIVE_AUTH_MODE:-service_account}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_SERVICE_ACCOUNT_JSON_BASE64:-}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?MEDIA_SIGNING_SECRET is required}
      MEDIA_SIGNED_URL_TTL: ${MEDIA_SIGNED_URL_TTL:-21600}
      MEDIA_MAX_RANGE_CHUNK: ${MEDIA_MAX_RANGE_CHUNK:-8388608}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/storage/uploads
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-15}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AniZora}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@anizora.local}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-120}
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-8}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - uploads-data:/app/storage/uploads
      # Mount your OWN Google service-account key here when you enable Drive:
      - ./secrets/google-service-account.json:/run/secrets/google-service-account.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [anizora]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-AniZora}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-false}
        NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${NEXT_PUBLIC_ADSENSE_CLIENT_ID:-}
        NEXT_PUBLIC_ADSENSE_TEST_MODE: ${NEXT_PUBLIC_ADSENSE_TEST_MODE:-true}
        NEXT_PUBLIC_VIDEO_ADS_ENABLED: ${NEXT_PUBLIC_VIDEO_ADS_ENABLED:-false}
        NEXT_PUBLIC_IMA_VAST_TAG_URL: ${NEXT_PUBLIC_IMA_VAST_TAG_URL:-}
        NEXT_PUBLIC_ADSTERRA_ENABLED: ${NEXT_PUBLIC_ADSTERRA_ENABLED:-false}
        NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC: ${NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC:-}
        NEXT_PUBLIC_ADSTERRA_FREQUENCY_HOURS: ${NEXT_PUBLIC_ADSTERRA_FREQUENCY_HOURS:-12}
    container_name: anizora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      INTERNAL_API_URL: http://backend:4000/api
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-AniZora}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_ADSTERRA_ENABLED: ${NEXT_PUBLIC_ADSTERRA_ENABLED:-false}
      NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC: ${NEXT_PUBLIC_ADSTERRA_POPUNDER_SRC:-}
      NEXT_PUBLIC_ADSTERRA_FREQUENCY_HOURS: ${NEXT_PUBLIC_ADSTERRA_FREQUENCY_HOURS:-12}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [anizora]

  # Optional reverse proxy: `docker compose --profile proxy up -d`
  nginx:
    image: nginx:1.27-alpine
    container_name: anizora-nginx
    restart: unless-stopped
    profiles: [proxy]
    depends_on: [frontend, backend]
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [anizora]

volumes:
  postgres-data:
  redis-data:
  uploads-data:

networks:
  anizora:
    driver: bridge
